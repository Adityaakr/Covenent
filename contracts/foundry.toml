[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
# Same compiler and EVM target as Flap's FlapPoolLaunchVaultExample, so its bases and fork tests drop in.
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read-write", path = "./abi" },
    { access = "read", path = "./out" },
]
gas_reports = ["CovenantLauncherFactory", "CovenantLauncher", "CovenantVaultFactory", "CovenantVault", "CovenantOracle", "CovenantLiteVault", "CovenantLens"]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 60
fail_on_revert = false

[profile.ci.fuzz]
runs = 4096

[rpc_endpoints]
bsc = "${BSC_RPC_URL}"
bsc_testnet = "${BSC_TESTNET_RPC_URL}"
local = "http://127.0.0.1:8545"

[fmt]
line_length = 120
ignore = ["src/flap/**", "src/vendor/**"]

[lint]
lint_on_build = false
